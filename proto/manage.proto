// Soul Injector management service payloads (SIDP opcodes 0x0100 and up).
//
// The SIDP header and response status prefix are unchanged; these messages
// are the payload after them. ASSET_WRITE is the exception: its payload is
// sidp::asset_write_request_t followed by raw data. See
// docs/sidp-management.md.
syntax = "proto3";

package si.manage;

message DeviceInfo {
    string serial = 1;
    string firmware_version = 2;
    uint32 storage_total_kb = 3;
    uint32 storage_free_kb = 4;
    uint64 log_newest_id = 5; // Newest production log entry; 0 when empty.
    uint64 log_acked_id = 6;  // Entries up to this ID have been collected.
    bool log_full = 7;        // Runs are refused: the log needs collecting, or a log write failed (until restart).
}

// Sets the device clock for this boot; the first request after boot wins.
message SetTimeRequest {
    uint64 utc_ms = 1; // Unix time in milliseconds.
}

// Asset names are bare file names stored under /data on the device.
message AssetBeginRequest {
    string name = 1;
    uint32 size = 2;
    bytes sha256 = 3;
}

message AssetBeginResponse {
    // True when the device already holds this exact asset; nothing to upload.
    bool present = 1;
    // Next byte to send. Non-zero when an interrupted upload is resumed.
    uint32 offset = 2;
}

enum Trigger {
    TRIGGER_MANUAL = 0;         // Runs only on JOB_RUN_ONCE.
    TRIGGER_AUTO_ON_DETECT = 1; // Also runs whenever a target is plugged in.
}

// Activates the job uploaded as asset "job.pb.new". Setting the active
// job's hash again only updates the trigger.
message JobSetRequest {
    bytes sha256 = 1;
    Trigger trigger = 2;
}

enum RunState {
    RUN_STATE_IDLE = 0;
    RUN_STATE_RUNNING = 1;
}

enum Outcome {
    OUTCOME_NONE = 0;
    OUTCOME_PASS = 1;
    OUTCOME_FAIL = 2;
    OUTCOME_CANCELLED = 3;
}

// Programming stage where a run failed or was cancelled.
enum Stage {
    STAGE_NONE = 0;
    STAGE_LOAD = 1;
    STAGE_PRE_PROGRAM = 2;
    STAGE_DETECT = 3;
    STAGE_ERASE = 4;
    STAGE_PROGRAM = 5;
    STAGE_VERIFY = 6;
    STAGE_SELF_TEST = 7;
    STAGE_POST_PROGRAM = 8;
    STAGE_CURRENT_TEST = 9;
}

message RunResult {
    uint32 run_id = 1;
    Outcome outcome = 2;
    Stage failed_stage = 3;
    uint32 duration_ms = 4;
}

message JobStatus {
    bool has_job = 1;
    string name = 2;
    bytes sha256 = 3;
    Trigger trigger = 4;
    RunState state = 5;
    uint32 current_run_id = 6; // Valid while RUNNING.
    RunResult last_result = 7; // run_id 0: nothing has run since boot.
}

message JobRunOnceResponse {
    uint32 run_id = 1;
}

message JobCancelRequest {
    uint32 run_id = 1; // 0 cancels whatever is running.
}

// ---- Production log ----
// Log entry IDs increase across reboots: boot counter << 40 | sequence.

enum LogEntryType {
    LOG_ENTRY_UNKNOWN = 0; // Corrupted or unknown; record is empty.
    LOG_ENTRY_BOOT = 1;    // record is a BootRecord.
    LOG_ENTRY_RUN = 2;     // record is a RunRecord.
}

message BootRecord {
    uint32 reset_reason = 1; // ESP-IDF esp_reset_reason_t.
}

message RunRecord {
    RunResult result = 1;
    Trigger trigger = 2; // MANUAL: requested over SIDP; AUTO_ON_DETECT: target plugged in.
    string job_name = 3;
    bytes job_sha256 = 4;
    int32 error_code = 5; // ESP-IDF esp_err_t of a failed run; 0 otherwise.
}

message LogReadRequest {
    uint64 after_id = 1; // Returns entries with larger IDs, oldest first.
}

message LogEntry {
    uint64 id = 1;
    uint64 uptime_us = 2; // Since the boot the entry was written in.
    uint64 utc_ms = 3;    // 0 when the clock was not set during that boot.
    LogEntryType type = 4;
    bytes record = 5;     // Encoded record message selected by type.
}

// As many entries as fit in one frame; empty when there are no more.
message LogReadResponse {
    repeated LogEntry entries = 1;
}

// Marks entries up to and including up_to_id as collected, so the device
// may overwrite them.
message LogAckRequest {
    uint64 up_to_id = 1;
}
